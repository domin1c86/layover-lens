services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AI_SEARCH_ENABLED: ${VITE_AI_SEARCH_ENABLED:-false}
    ports:
      - "3200:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - DATABASE_URL=mysql+mysqlconnector://root:devpassword@mysql:3306/layover_lens
      - APP_ENV=development
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost:3200","http://127.0.0.1:3200"]
      - SESSION_COOKIE_SECRET=${SESSION_COOKIE_SECRET:-dev-session-cookie-secret}
      - CSRF_SECRET=${CSRF_SECRET:-dev-csrf-secret}
      - TOTP_ENCRYPTION_SECRET=${TOTP_ENCRYPTION_SECRET:-dev-totp-encryption-secret}
      - TOTP_ISSUER_NAME=${TOTP_ISSUER_NAME:-Layover Lens}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - SESSION_COOKIE_SAMESITE=${SESSION_COOKIE_SAMESITE:-lax}
      - DISABLE_BEARER_AUTH_IN_PRODUCTION=${DISABLE_BEARER_AUTH_IN_PRODUCTION:-true}
      - DATA_SOURCE=mock
      - ROUTE_PLANNER_BACKEND=cpp
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - AI_MODEL_PROVIDER=${AI_MODEL_PROVIDER:-deepseek}
      - AI_MODEL_API_KEY=${AI_MODEL_API_KEY:-}
      - AI_MODEL_BASE_URL=${AI_MODEL_BASE_URL:-}
      - AI_MODEL_NAME=${AI_MODEL_NAME:-}
      - AI_MODEL_TIMEOUT_SECONDS=${AI_MODEL_TIMEOUT_SECONDS:-30}
      - AI_MODEL_SUPPORTS_JSON_MODE=${AI_MODEL_SUPPORTS_JSON_MODE:-true}
      - AI_AGENT_TURN_MODE=${AI_AGENT_TURN_MODE:-single}
      - LANGGRAPH_CHECKPOINT_DATABASE_URL=postgresql://langgraph:${LANGGRAPH_POSTGRES_PASSWORD:-dev-langgraph-password}@postgres:5432/langgraph
      - LANGGRAPH_AES_KEY=${LANGGRAPH_AES_KEY:-dev-langgraph-key-32-bytes-long!}
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langgraph
      POSTGRES_PASSWORD: ${LANGGRAPH_POSTGRES_PASSWORD:-dev-langgraph-password}
      POSTGRES_DB: langgraph
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph -d langgraph"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: devpassword
      MYSQL_DATABASE: layover_lens
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
  postgres_data:
